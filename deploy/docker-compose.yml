x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: ticket-queue-redis
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    image: ${QUEUE_API_DOCKER_IMAGE:?QUEUE_API_DOCKER_IMAGE is required}
    container_name: ticket-queue-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      QUEUE_DEFAULT_QUEUE_TTL: ${QUEUE_DEFAULT_QUEUE_TTL:-24h}
      QUEUE_DEFAULT_REFRESH_AFTER_MS: ${QUEUE_DEFAULT_REFRESH_AFTER_MS:-5000}
      QUEUE_SHARD_COUNT: ${QUEUE_SHARD_COUNT:-128}
      QUEUE_SLOT_SIZE_MILLIS: ${QUEUE_SLOT_SIZE_MILLIS:-50}
      QUEUE_SLOT_CLOSE_GRACE_MILLIS: ${QUEUE_SLOT_CLOSE_GRACE_MILLIS:-200}
      JAVA_TOOL_OPTIONS: -javaagent:/opt/datadog/dd-java-agent.jar
      DD_AGENT_HOST: datadog-agent
      DD_SERVICE: ticket-queue-api
      DD_ENV: ${DD_ENV:-prod}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_VERSION: ${DD_VERSION:?DD_VERSION is required}
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    labels:
      com.datadoghq.tags.service: ticket-queue-api
      com.datadoghq.tags.env: ${DD_ENV:-prod}
      com.datadoghq.tags.version: ${DD_VERSION:?DD_VERSION is required}
      com.datadoghq.ad.logs: >-
        [{"source":"java","service":"ticket-queue-api"}]
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:8090/actuator/prometheus","namespace":"ticket_queue_api","metrics":[".*"]}]}}

  scheduler:
    image: ${QUEUE_SCHEDULER_DOCKER_IMAGE:?QUEUE_SCHEDULER_DOCKER_IMAGE is required}
    container_name: ticket-queue-scheduler
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      QUEUE_DEFAULT_QUEUE_TTL: ${QUEUE_DEFAULT_QUEUE_TTL:-24h}
      QUEUE_ADVANCE_BATCH_SIZE: ${QUEUE_ADVANCE_BATCH_SIZE:-500}
      QUEUE_DEFAULT_REFRESH_AFTER_MS: ${QUEUE_DEFAULT_REFRESH_AFTER_MS:-5000}
      QUEUE_SHARD_COUNT: ${QUEUE_SHARD_COUNT:-128}
      QUEUE_SLOT_SIZE_MILLIS: ${QUEUE_SLOT_SIZE_MILLIS:-50}
      QUEUE_SLOT_CLOSE_GRACE_MILLIS: ${QUEUE_SLOT_CLOSE_GRACE_MILLIS:-200}
      QUEUE_ADVANCE_INTERVAL_MS: ${QUEUE_ADVANCE_INTERVAL_MS:-1000}
      JAVA_TOOL_OPTIONS: -javaagent:/opt/datadog/dd-java-agent.jar
      DD_AGENT_HOST: datadog-agent
      DD_SERVICE: ticket-queue-scheduler
      DD_ENV: ${DD_ENV:-prod}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_VERSION: ${DD_VERSION:?DD_VERSION is required}
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
    expose:
      - "8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    labels:
      com.datadoghq.tags.service: ticket-queue-scheduler
      com.datadoghq.tags.env: ${DD_ENV:-prod}
      com.datadoghq.tags.version: ${DD_VERSION:?DD_VERSION is required}
      com.datadoghq.ad.logs: >-
        [{"source":"java","service":"ticket-queue-scheduler"}]
      com.datadoghq.ad.checks: >-
        {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:8091/actuator/prometheus","namespace":"ticket_queue_scheduler","metrics":[".*"]}]}}

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: ticket-queue-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - queue
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  datadog-agent:
    image: gcr.io/datadoghq/agent:7.82.1@sha256:c778490306882f4ed64ff61f5fe8d841ed9061ab52c19edf2afe0f3ba84ab650
    container_name: datadog-agent
    restart: unless-stopped
    logging: *default-logging
    pid: host
    cgroup: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY is required}
      DD_SITE: ${DD_SITE:-us5.datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_LOGS_CONFIG_DOCKER_CONTAINER_USE_FILE: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_CONTAINER_EXCLUDE_LOGS: name:datadog-agent
      DD_ENV: ${DD_ENV:-prod}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /home/ubuntu/datadog-agent/run:/opt/datadog-agent/run:rw
      - ./datadog/conf.d/redisdb.d/conf.yaml:/etc/datadog-agent/conf.d/redisdb.d/conf.yaml:ro

volumes:
  redis-data:
