name: Queue CI/CD (Docker Hub)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: deploy-ticket-queue
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: aws-queue
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Queue API jar
        uses: actions/download-artifact@v4
        with:
          name: queue-api-jar
          path: queue-api/build/libs

      - name: Download verified Queue Scheduler jar
        uses: actions/download-artifact@v4
        with:
          name: queue-scheduler-jar
          path: queue-scheduler/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Queue API image
        uses: docker/build-push-action@v6
        with:
          context: ./queue-api
          file: ./queue-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ticket-queue-api:latest
            ${{ secrets.DOCKER_USERNAME }}/ticket-queue-api:${{ github.sha }}
          cache-from: type=gha,scope=queue-api
          cache-to: type=gha,mode=max,scope=queue-api

      - name: Build and push Queue Scheduler image
        uses: docker/build-push-action@v6
        with:
          context: ./queue-scheduler
          file: ./queue-scheduler/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ticket-queue-scheduler:latest
            ${{ secrets.DOCKER_USERNAME }}/ticket-queue-scheduler:${{ github.sha }}
          cache-from: type=gha,scope=queue-scheduler
          cache-to: type=gha,mode=max,scope=queue-scheduler

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          script: |
            set -e
            sudo mkdir -p /home/ubuntu/datadog-agent/run
            sudo chown -R "$USER:$USER" /home/ubuntu/datadog-agent
            sudo mkdir -p /home/ubuntu/ticket-queue/nginx
            sudo mkdir -p /home/ubuntu/ticket-queue/certbot/www
            sudo mkdir -p /home/ubuntu/ticket-queue/datadog/conf.d/redisdb.d
            sudo chown -R "$USER:$USER" /home/ubuntu/ticket-queue

      - name: Upload docker compose config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          source: "deploy/docker-compose.yml"
          target: "/home/ubuntu/ticket-queue"
          strip_components: 1
          overwrite: true

      - name: Upload nginx main config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          source: "deploy/nginx/nginx.conf"
          target: "/home/ubuntu/ticket-queue"
          strip_components: 1
          overwrite: true

      - name: Upload nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          source: "deploy/nginx/default.conf"
          target: "/home/ubuntu/ticket-queue"
          strip_components: 1
          overwrite: true

      - name: Upload Datadog Redis config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          source: "deploy/datadog/conf.d/redisdb.d/conf.yaml"
          target: "/home/ubuntu/ticket-queue"
          strip_components: 1
          overwrite: true

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}
          port: ${{ secrets.AWS_VM_PORT || '22' }}
          script: |
            set -e
            API_IMAGE="${{ secrets.DOCKER_USERNAME }}/ticket-queue-api:${{ github.sha }}"
            SCHEDULER_IMAGE="${{ secrets.DOCKER_USERNAME }}/ticket-queue-scheduler:${{ github.sha }}"
            DEPLOY_DIR="/home/ubuntu/ticket-queue"

            cd "$DEPLOY_DIR"
            test -f .env
            test -f docker-compose.yml
            sudo test -f /etc/letsencrypt/live/queue.oneticket.site/fullchain.pem || { echo "missing TLS certificate: /etc/letsencrypt/live/queue.oneticket.site/fullchain.pem"; exit 1; }
            sudo test -f /etc/letsencrypt/live/queue.oneticket.site/privkey.pem || { echo "missing TLS private key: /etc/letsencrypt/live/queue.oneticket.site/privkey.pem"; exit 1; }
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker pull "$API_IMAGE"
            sudo docker pull "$SCHEDULER_IMAGE"
            sudo QUEUE_API_DOCKER_IMAGE="$API_IMAGE" QUEUE_SCHEDULER_DOCKER_IMAGE="$SCHEDULER_IMAGE" docker compose -f docker-compose.yml up -d --remove-orphans
            sudo docker image prune -f
