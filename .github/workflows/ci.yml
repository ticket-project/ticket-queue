name: Pull Request CI

on:
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: queue-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew test integrationTest :queue-api:bootJar :queue-scheduler:bootJar --no-daemon

      - name: Upload verified Queue API jar
        uses: actions/upload-artifact@v4
        with:
          name: queue-api-jar
          path: queue-api/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified Queue Scheduler jar
        uses: actions/upload-artifact@v4
        with:
          name: queue-scheduler-jar
          path: queue-scheduler/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
